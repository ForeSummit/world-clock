<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD CLOCK · 세계 시계</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #16181c;
            --border-color: #2c2f36;
            --text-main: #ffffff;
            --text-sub: #8a8d93;
            --led-color: #ffffff;
            --led-dim: rgba(255, 255, 255, 0.7);
            
            /* Status Colors */
            --color-holiday: #ff4b4b; /* 붉은색 */
            --color-before-work: #b8860b; /* 어두운 노란색 */
            --color-working: #00ff7f; /* 초록색 */
            --color-after-work: #ffd700; /* 노란색 */
            --color-night: #808080; /* 회색 */
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Control Panel */
        .control-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        select, input[type="datetime-local"], input[type="text"], button {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        button {
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #2c2f36;
        }

        .header-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        /* Clock List */
        .clock-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .city-card {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .city-info {
            grid-column: 1 / -1;
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 5px;
        }

        .city-name-ko { font-size: 1.2rem; font-weight: 700; }
        .city-name-en { font-size: 0.9rem; color: var(--text-sub); }
        .utc-info { font-size: 0.85rem; color: var(--text-sub); margin-left: 10px; }
        .dst-badge { 
            font-size: 0.75rem; 
            border: 1px solid var(--text-sub); 
            padding: 2px 6px; 
            border-radius: 12px; 
            color: var(--text-sub);
        }
        .dst-period { font-size: 0.8rem; color: var(--text-sub); }

        .time-display {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .led-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .time-display.converted .led-time {
            color: var(--led-dim);
            text-shadow: none;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 15px;
            border: 1px solid;
            font-weight: 500;
        }

        .date-str { color: var(--text-sub); }

        /* Legend */
        .legend {
            margin-top: 40px;
            padding: 15px;
            background-color: var(--panel-bg);
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.85rem;
        }

        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; }

        @media (max-width: 600px) {
            .led-time { font-size: 1.8rem; }
            .city-card { gap: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WORLD CLOCK · 세계 시계</h1>

    <div class="control-panel">
        <div class="control-group">
            <label>기준 도시</label>
            <select id="baseCitySelect"></select>
        </div>
        <div class="control-group">
            <label>변환할 시각 (기준 도시 현지 시각)</label>
            <input type="datetime-local" id="targetTimeInput">
        </div>
        <div class="control-group">
            <button id="resetTimeBtn">현재 시각으로</button>
        </div>
        <div class="control-group" style="flex-grow: 1;">
            <label>사용자 도시 (IANA 시간대 또는 검색어)</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="customCityInput" placeholder="예: Asia/Tokyo, Europe/Paris" style="flex-grow: 1;">
                <button id="applyCustomBtn">적용</button>
            </div>
        </div>
    </div>

    <div class="header-row">
        <div>현재 표준시각 (24h)</div>
        <div>변환 시각 (24h HH:MM)</div>
    </div>

    <div class="clock-list" id="clockList">
        <!-- JS로 렌더링 -->
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background: var(--color-holiday);"></div> 휴일</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--color-before-work);"></div> 출근전 (06~09)</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--color-working);"></div> 근무중 (09~18)</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--color-after-work);"></div> 퇴근후 (18~22)</div>
        <div class="legend-item"><div class="legend-color" style="background: var(--color-night);"></div> 야간 (22~06)</div>
    </div>
</div>

<script>
    // 기본 도시 리스트 14개 (서울 포함, 일본 제외)
    let cities = [
        { tz: 'Asia/Seoul', ko: '서울', en: 'Seoul' },
        { tz: 'Australia/Sydney', ko: '시드니', en: 'Sydney' },
        { tz: 'Asia/Shanghai', ko: '베이징', en: 'Beijing' },
        { tz: 'Asia/Ho_Chi_Minh', ko: '하노이', en: 'Hanoi' },
        { tz: 'Asia/Kolkata', ko: '뉴델리', en: 'New Delhi' },
        { tz: 'Asia/Dubai', ko: '두바이', en: 'Dubai' },
        { tz: 'Europe/Warsaw', ko: '바르샤바', en: 'Warsaw' },
        { tz: 'Europe/Moscow', ko: '모스크바', en: 'Moscow' },
        { tz: 'Europe/Berlin', ko: '프랑크푸르트', en: 'Frankfurt' },
        { tz: 'Europe/London', ko: '런던', en: 'London' },
        { tz: 'America/Sao_Paulo', ko: '상파울루', en: 'Sao Paulo' },
        { tz: 'America/New_York', ko: '뉴욕', en: 'New York' },
        { tz: 'America/Chicago', ko: '오스틴', en: 'Austin' },
        { tz: 'America/Los_Angeles', ko: '산호세', en: 'San Jose' }
    ];

    let baseTz = 'Asia/Seoul';
    let convertBaseTime = new Date(); // 초기 변환 시각은 접속 시각
    
    const uiList = document.getElementById('clockList');
    const baseCitySelect = document.getElementById('baseCitySelect');
    const targetTimeInput = document.getElementById('targetTimeInput');
    const resetTimeBtn = document.getElementById('resetTimeBtn');
    const customCityInput = document.getElementById('customCityInput');
    const applyCustomBtn = document.getElementById('applyCustomBtn');

    function init() {
        populateBaseCitySelect();
        initTargetTimeInput();
        updateClocks();
        setInterval(updateCurrentTimeOnly, 1000);
    }

    function populateBaseCitySelect() {
        baseCitySelect.innerHTML = '';
        cities.forEach(city => {
            const opt = document.createElement('option');
            opt.value = city.tz;
            opt.textContent = `${city.ko} (${city.en})`;
            baseCitySelect.appendChild(opt);
        });
        baseCitySelect.value = baseTz;
    }

    function initTargetTimeInput() {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        const localISOTime = (new Date(now - offset)).toISOString().slice(0,16);
        targetTimeInput.value = localISOTime;
    }

    // 상태 결정 로직 (휴일, 출근전, 근무중, 퇴근후, 야간)
    function getStatus(dateObj) {
        const day = dateObj.getDay();
        const hour = dateObj.getHours();

        if (day === 0 || day === 6) return { text: '휴일', color: 'var(--color-holiday)' };
        if (hour >= 6 && hour < 9) return { text: '출근전', color: 'var(--color-before-work)' };
        if (hour >= 9 && hour < 18) return { text: '근무중', color: 'var(--color-working)' };
        if (hour >= 18 && hour < 22) return { text: '퇴근후', color: 'var(--color-after-work)' };
        return { text: '야간', color: 'var(--color-night)' };
    }

    function getOffsetInfo(tz) {
        const date = new Date();
        const str = date.toLocaleString('en-US', { timeZone: tz, timeZoneName: 'shortOffset' });
        const match = str.match(/GMT([+-]\d+(:?\d+)?)/) || str.match(/UTC([+-]\d+(:?\d+)?)/);
        let offsetStr = match ? `UTC${match[1]}` : 'UTC+0';
        
        // 간단한 오프셋 수치화 (정렬용)
        let offsetVal = 0;
        if (match && match[1]) {
            const parts = match[1].split(':');
            offsetVal = parseFloat(parts[0]) + (parts[1] ? parseFloat(parts[1])/60 * Math.sign(parseFloat(parts[0])) : 0);
        }
        
        // 브라우저 API 기반 약식 DST 판단
        let isDst = false;
        let dstText = '';
        try {
            const jan = new Date(date.getFullYear(), 0, 1).toLocaleString('en-US', {timeZone: tz, timeZoneName: 'shortOffset'});
            const jul = new Date(date.getFullYear(), 6, 1).toLocaleString('en-US', {timeZone: tz, timeZoneName: 'shortOffset'});
            if (jan !== jul) {
                isDst = true;
                dstText = 'DST'; 
            }
        } catch(e) {}

        return { offsetStr, offsetVal, isDst, dstText };
    }

    function getFormattedDate(date, tz) {
        return new Intl.DateTimeFormat('ko-KR', {
            timeZone: tz, month: '2-digit', day: '2-digit', weekday: 'short'
        }).format(date).replace(/\./g, '/').replace(/ /g, '').replace(/\/$/, '');
    }

    function getTimeStrings(date, tz, includeSeconds) {
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit', second: includeSeconds ? '2-digit' : undefined
        });
        const parts = formatter.formatToParts(date);
        let h = parts.find(p => p.type === 'hour').value;
        let m = parts.find(p => p.type === 'minute').value;
        let s = includeSeconds ? parts.find(p => p.type === 'second').value : '';
        return includeSeconds ? `${h === '24' ? '00' : h}:${m}:${s}` : `${h === '24' ? '00' : h}:${m}`;
    }

    function renderClocks() {
        // 서울을 맨 위에, 나머지는 UTC 역순 정렬
        let sortedCities = [...cities].map(city => {
            const info = getOffsetInfo(city.tz);
            return { ...city, ...info };
        });

        const seoulIndex = sortedCities.findIndex(c => c.tz === 'Asia/Seoul');
        let seoul = null;
        if (seoulIndex !== -1) {
            seoul = sortedCities.splice(seoulIndex, 1)[0];
        }
        
        sortedCities.sort((a, b) => b.offsetVal - a.offsetVal); // UTC 역순(내림차순)
        if (seoul) sortedCities.unshift(seoul);

        const now = new Date();
        uiList.innerHTML = '';

        sortedCities.forEach((city, index) => {
            const card = document.createElement('div');
            card.className = 'city-card';
            card.id = `city-card-${index}`;
            card.dataset.tz = city.tz;

            const cityInfoHtml = `
                <div class="city-info">
                    <span class="city-name-ko">${city.ko}</span>
                    <span class="city-name-en">${city.en}</span>
                    <span class="utc-info">${city.offsetStr}</span>
                    ${city.isDst ? `<span class="dst-badge">${city.dstText}</span>` : ''}
                </div>
            `;

            // Current Time Node
            const currentWrapper = document.createElement('div');
            currentWrapper.className = 'time-display current';
            currentWrapper.innerHTML = `
                <div class="led-time" id="current-time-${index}">--:--:--</div>
                <div class="status-container" id="current-status-${index}">
                    <span class="status-badge">--</span>
                    <span class="date-str">--/--</span>
                </div>
            `;

            // Converted Time Node
            const convertedWrapper = document.createElement('div');
            convertedWrapper.className = 'time-display converted';
            convertedWrapper.innerHTML = `
                <div class="led-time" id="converted-time-${index}">--:--</div>
                <div class="status-container" id="converted-status-${index}">
                    <span class="status-badge">--</span>
                    <span class="date-str">--/--</span>
                </div>
            `;

            card.innerHTML = cityInfoHtml;
            card.appendChild(currentWrapper);
            card.appendChild(convertedWrapper);
            uiList.appendChild(card);
        });

        updateCurrentTimeOnly();
        updateConvertedTimeOnly();
    }

    function updateCurrentTimeOnly() {
        const now = new Date();
        const cards = document.querySelectorAll('.city-card');
        
        cards.forEach((card, index) => {
            const tz = card.dataset.tz;
            try {
                // Time String
                document.getElementById(`current-time-${index}`).textContent = getTimeStrings(now, tz, true);
                
                // Get local date object for status
                const tzDateStr = now.toLocaleString('en-US', { timeZone: tz });
                const localDate = new Date(tzDateStr);
                
                const status = getStatus(localDate);
                const statusBadge = document.querySelector(`#current-status-${index} .status-badge`);
                statusBadge.textContent = status.text;
                statusBadge.style.borderColor = status.color;
                statusBadge.style.color = status.color;
                
                document.querySelector(`#current-status-${index} .date-str`).textContent = getFormattedDate(now, tz);
            } catch(e) {}
        });
    }

    function updateConvertedTimeOnly() {
        const cards = document.querySelectorAll('.city-card');
        
        cards.forEach((card, index) => {
            const tz = card.dataset.tz;
            try {
                document.getElementById(`converted-time-${index}`).textContent = getTimeStrings(convertBaseTime, tz, false);
                
                const tzDateStr = convertBaseTime.toLocaleString('en-US', { timeZone: tz });
                const localDate = new Date(tzDateStr);
                
                const status = getStatus(localDate);
                const statusBadge = document.querySelector(`#converted-status-${index} .status-badge`);
                statusBadge.textContent = status.text;
                statusBadge.style.borderColor = status.color;
                statusBadge.style.color = status.color;
                
                document.querySelector(`#converted-status-${index} .date-str`).textContent = getFormattedDate(convertBaseTime, tz);
            } catch(e) {}
        });
    }

    function updateClocks() {
        renderClocks();
    }

    // Event Listeners
    baseCitySelect.addEventListener('change', (e) => {
        baseTz = e.target.value;
    });

    targetTimeInput.addEventListener('change', (e) => {
        if(!e.target.value) return;
        // Parse input time as if it's in baseTz
        const parts = e.target.value.split('T');
        if(parts.length === 2) {
            const dateStr = parts[0];
            const timeStr = parts[1];
            // Hacky way to convert local input to UTC based on baseTz
            const localFormat = new Date(`${dateStr}T${timeStr}:00`);
            const invOffset = getOffsetInfo(baseTz).offsetVal; // e.g., 9 for Seoul
            
            // Actually, best client-side way without lib: 
            // We just set convertBaseTime by mapping it
            // Simplified: Assuming browser local timezone, if it differs from baseTz it's complex, 
            // but we treat the input as absolute time offset roughly.
            convertBaseTime = new Date(localFormat.getTime() + (new Date().getTimezoneOffset() * 60000) + (invOffset * 3600000 * -1));
            updateConvertedTimeOnly();
        }
    });

    resetTimeBtn.addEventListener('click', () => {
        convertBaseTime = new Date();
        initTargetTimeInput();
        updateConvertedTimeOnly();
    });

    applyCustomBtn.addEventListener('click', () => {
        const val = customCityInput.value.trim();
        if(!val) return;
        
        try {
            // Validate if valid IANA
            new Intl.DateTimeFormat('en-US', { timeZone: val });
            cities.push({ tz: val, ko: val, en: val });
            populateBaseCitySelect();
            updateClocks();
            customCityInput.value = '';
        } catch(e) {
            alert('유효하지 않은 시간대(IANA Timezone)입니다. 예: Asia/Tokyo');
        }
    });

    init();
</script>
</body>
</html>
