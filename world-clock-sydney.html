<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World Clock · 세계 시계</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--line:#1f1f22;--dim:#9a9aa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#000;color:#e6e6e6;font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100%}
.w{max-width:1100px;margin:0 auto;padding:10px 12px 28px}
h1{font-family:Orbitron,'Noto Sans KR',sans-serif;font-size:clamp(18px,5.4vw,30px);letter-spacing:.08em;margin:6px 0 16px;color:#fff;font-weight:700}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;padding:16px;border:1px solid #2c2c30;border-radius:18px;background:#0d0d0f;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;color:var(--dim)}
.f .row{display:flex;gap:8px;min-width:0}
input,select,button{background:#0d0d0f;color:#f0f0f0;border:1px solid #3a3a40;border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;min-width:0}
select,input[type=datetime-local]{width:100%}
.f .row input{flex:1}
button{cursor:pointer;white-space:nowrap}button:hover{background:#1a1a1d}
.f.e{justify-content:flex-end}
#msg{font-size:12px;color:#e0b040;min-height:0}
.r{display:grid;grid-template-columns:minmax(250px,1.2fr) minmax(0,1.3fr) minmax(0,1fr);gap:6px 16px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.r.h{font-size:13px;color:var(--dim);padding:8px}
.r.b{background:#0c1024;border-top:1px solid #2a3560;border-bottom:1px solid #2a3560}
.c b{font-size:20px;color:#fff;margin-right:8px}
.c small{font-size:15px;color:var(--dim)}
.m{display:block;font-size:12.5px;color:var(--dim);margin-top:3px}
.m em{font-style:normal;color:#ff9f43;margin-left:5px}
.led{display:inline-flex;align-items:center;gap:.04em;font-size:46px;height:1em;color:#fff;filter:drop-shadow(0 0 3px rgba(255,255,255,.55)) drop-shadow(0 0 9px rgba(255,255,255,.2))}
.led.cv{color:#a6a6ac;filter:drop-shadow(0 0 3px rgba(190,190,190,.3))}
.d{width:.6em;height:1em;fill:currentColor}.k{width:.28em;height:1em;fill:currentColor}
.d .off{opacity:.1}
.sub{display:flex;align-items:center;gap:10px;margin-top:8px;white-space:nowrap}
.sub span{color:var(--dim);font-size:15px}
.bd{font-style:normal;font-weight:700;font-size:15px;padding:3px 10px;border-radius:9px;border:2px solid;white-space:nowrap}
.hol{color:#ff5a5a;border-color:#ff5a5a;background:rgba(255,90,90,.1)}
.pre{color:#b09014;border-color:#8f7710;background:rgba(176,144,20,.1)}
.on{color:#33d17a;border-color:#22a860;background:rgba(51,209,122,.1)}
.post{color:#ffd21f;border-color:#ffd21f;background:rgba(255,210,31,.1)}
.ngt{color:#9a9a9a;border-color:#666;background:rgba(150,150,150,.08)}
.lg{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--dim);align-items:center}
.lg .bd{font-size:12px;padding:1px 7px;border-width:1px}
.note{margin-top:10px;font-size:12px;color:#777;line-height:1.6}
@media(max-width:700px){
 .w{padding:8px 8px 24px}
 .ctl{padding:14px;gap:12px}
 .r{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 8px;padding:12px 6px}
 .r.h>div:first-child{display:none}
 .c{grid-column:1/-1}
